<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="OREI HDMI Matrix Kiosk Control Panel">
    <meta property="og:title" content="OREI Matrix - Kiosk">
    <meta property="og:description" content="OREI HDMI Matrix Kiosk Control Panel">
    <meta property="og:type" content="website">
    <title>OREI Matrix - Kiosk</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --primary-color: #3b82f6;
            --primary-dark: #2563eb;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --border-color: #475569;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .kiosk-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 12px;
            gap: 12px;
        }

        .kiosk-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .kiosk-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .kiosk-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--error-color);
            transition: background 0.3s;
        }

        .status-dot.connected {
            background: var(--success-color);
        }

        .kiosk-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        /* 4 columns on wider tablets */
        @media (min-width: 600px) and (min-height: 400px) {
            .kiosk-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* 2x4 layout on landscape tablets */
        @media (min-width: 800px) {
            .kiosk-grid {
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(2, 1fr);
            }
        }

        .kiosk-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 12px;
            background: var(--bg-secondary);
            border: 3px solid var(--border-color);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        .kiosk-btn:active {
            transform: scale(0.97);
        }

        /* Status indicator bar on left */
        .kiosk-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: var(--text-muted);
            transition: background 0.3s;
        }

        .kiosk-btn.status-signal::before {
            background: var(--success-color);
        }

        .kiosk-btn.status-cable::before {
            background: var(--warning-color);
        }

        .kiosk-btn.status-disconnected::before {
            background: var(--error-color);
        }

        .kiosk-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-lg), 0 0 30px rgba(59, 130, 246, 0.4);
        }

        .kiosk-btn.active::before {
            background: white;
        }

        .kiosk-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .kiosk-btn-number {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            line-height: 1;
            color: var(--text-muted);
        }

        .kiosk-btn.active .kiosk-btn-number {
            color: rgba(255, 255, 255, 0.9);
        }

        .kiosk-btn-name {
            font-size: clamp(0.9rem, 2.5vw, 1.25rem);
            font-weight: 600;
            text-align: center;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
            padding: 0 8px;
        }

        .kiosk-btn.active .kiosk-btn-name {
            color: white;
        }

        /* Loading spinner */
        .kiosk-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 32px;
            height: 32px;
            margin: -16px 0 0 -16px;
            border: 4px solid transparent;
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .kiosk-btn.active.loading::after {
            border-top-color: white;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast notifications */
        .kiosk-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .kiosk-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .kiosk-toast.success {
            background: var(--success-color);
        }

        .kiosk-toast.error {
            background: var(--error-color);
        }

        /* Settings button */
        .kiosk-settings-btn {
            background: transparent;
            border: none;
            padding: 8px;
            cursor: pointer;
            color: var(--text-muted);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .kiosk-settings-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .kiosk-settings-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Exit hint in header */
        .kiosk-exit-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.6;
            margin-left: auto;
            padding-right: 12px;
        }

        /* Output count badge on input buttons */
        .kiosk-btn-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            min-width: 24px;
            height: 24px;
            padding: 0 6px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .kiosk-btn.active .kiosk-btn-badge {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        /* Output status footer */
        .kiosk-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .kiosk-footer-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .output-status-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
        }

        .output-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 4px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .output-tile.connected {
            border-color: var(--success-color);
        }

        .output-tile.disconnected {
            opacity: 0.4;
        }

        .output-tile-num {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .output-tile-input {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .output-tile-name {
            font-size: 0.6rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            text-align: center;
        }

        /* Compact footer on small screens */
        @media (max-width: 500px) {
            .output-status-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* 4-Tab Swiping Container and Tabs Bar */
        .kiosk-tabs-bar {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
            flex-shrink: 0;
        }

        .kiosk-tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 4px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            border: 2px solid transparent;
        }

        .kiosk-tab-btn:hover {
            color: var(--text-secondary);
        }

        .kiosk-tab-btn.active {
            background: var(--primary-color);
            color: var(--text-primary);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .kiosk-pin-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 8px;
            border-radius: 8px;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .kiosk-pin-btn.pinned {
            color: var(--warning-color);
            transform: scale(1.1);
        }

        .kiosk-swipe-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .kiosk-swipe-wrapper {
            display: flex;
            width: 400%; /* 4 panels */
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .kiosk-panel {
            width: 25%; /* 1/4 of container */
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 4px;
        }

        /* Edit layout header styles */
        .kiosk-header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .kiosk-edit-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .kiosk-edit-btn.active {
            background: var(--warning-color);
            border-color: var(--warning-color);
            color: var(--bg-primary);
        }

        .kiosk-edit-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Dotted placeholder style for edit mode */
        .kiosk-btn.placeholder {
            border-style: dashed;
            background: transparent;
            opacity: 0.5;
            color: var(--text-muted);
        }

        .kiosk-btn.placeholder:hover {
            opacity: 0.8;
            border-color: var(--warning-color);
            color: var(--warning-color);
        }

        /* Configured item details on tiles */
        .kiosk-btn-icon {
            font-size: 2.2rem;
            line-height: 1;
        }

        .kiosk-btn-config {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .kiosk-btn:hover .kiosk-btn-config {
            opacity: 1;
            color: var(--warning-color);
        }

        /* Modals and guided wizards */
        .kiosk-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .kiosk-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .kiosk-modal-content {
            background: var(--bg-secondary);
            border: 3px solid var(--border-color);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg), 0 0 40px rgba(0,0,0,0.5);
            max-height: 85vh;
        }

        .kiosk-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .kiosk-modal-header h4 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .kiosk-modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
            line-height: 1;
        }

        .kiosk-modal-close:hover {
            color: var(--error-color);
        }

        .kiosk-modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .kiosk-modal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-top: 2px solid var(--border-color);
            gap: 12px;
        }

        /* Wizard style buttons and elements */
        .wizard-instruction {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .wizard-option-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            text-align: left;
            transition: all 0.15s;
        }

        .wizard-option-btn:hover {
            border-color: var(--primary-color);
            background: rgba(59, 130, 246, 0.1);
        }

        .wizard-option-btn.primary-option {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--primary-color);
            text-align: center;
        }

        .wizard-option-btn.primary-option:hover {
            background: var(--primary-color);
        }

        .wizard-checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: 10px;
            background: var(--bg-tertiary);
            cursor: pointer;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .wizard-checkbox-label input {
            width: 18px;
            height: 18px;
        }

        .wizard-link-btn {
            background: transparent;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 4px 0;
            text-align: left;
            display: block;
            margin-bottom: 16px;
        }

        .wizard-link-btn:hover {
            text-decoration: underline;
        }

        .wizard-advanced-settings {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            margin-top: 8px;
        }

        .settings-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .settings-row label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .settings-row select, .wizard-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .wizard-input:focus, .settings-row select:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .btn-wizard {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
        }

        .btn-prev {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .btn-next, .btn-save {
            background: var(--primary-color);
            color: var(--text-primary);
            margin-left: auto;
        }

        .btn-delete {
            background: var(--error-color);
            color: white;
        }

        .hidden {
            display: none !important;
        }

        /* Icon Picker for Profiles Wizard */
        .wizard-icon-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .icon-picker-btn {
            width: 44px;
            height: 44px;
            font-size: 1.5rem;
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .icon-picker-btn.selected {
            border-color: var(--primary-color);
            background: rgba(59, 130, 246, 0.2);
        }

        /* Output Grid in Modal Builders */
        .modal-outputs-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .modal-output-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: 10px;
        }

        .modal-output-row label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .modal-output-row select {
            width: 140px;
            padding: 6px 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
        }

        /* Slot Mapper styling */
        .slot-mapping-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 40vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .slot-mapping-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .slot-mapping-item:hover {
            border-color: var(--warning-color);
            background: rgba(245, 158, 11, 0.1);
        }

        .slot-mapping-item-icon {
            font-size: 1.4rem;
        }

        .slot-mapping-item-name {
            font-size: 0.95rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="kiosk-container">
        <header class="kiosk-header">
            <span class="kiosk-title" id="kioskTitle">Select Input</span>
            <div class="kiosk-header-actions">
                <button class="kiosk-edit-btn" id="kioskEditBtn" title="Edit Layout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>Edit Layout</span>
                </button>
                <div class="kiosk-status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Connecting...</span>
                    <a href="/ui" class="kiosk-settings-btn" title="Full UI">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </a>
                </div>
            </div>
        </header>

        <div class="kiosk-tabs-bar">
            <button class="kiosk-tab-btn active" data-tab="routing">Routing</button>
            <button class="kiosk-tab-btn" data-tab="presets">Presets</button>
            <button class="kiosk-tab-btn" data-tab="quick-actions">Quick Actions</button>
            <button class="kiosk-tab-btn" data-tab="profiles">Profiles</button>
            <button class="kiosk-pin-btn" id="kioskPinBtn" title="Pin Active Tab">📌</button>

    <div class="kiosk-toast" id="kioskToast"></div>

    <script>
        /**
         * OREI Matrix Kiosk Mode
         * Comprehensive Multi-tab swipe control interface
         */
        (function() {
            'use strict';

            // Configuration
            const API_BASE = '/api';
            const POLL_INTERVAL = 5000;
            const WS_RECONNECT_DELAY = 2000;

            // State
            let connected = false;
            let routing = {};
            let inputs = {};
            let outputs = {};
            let ws = null;
            let pollTimer = null;

            // Configurable data lists
            let presets = [];
            let shortcuts = [];
            let profiles = [];
            let macros = [];

            // UI parameters
            let activeTab = 'routing';
            let editModeActive = false;
            let pinnedQuickActions = [];
            let pinnedProfiles = [];

            // DOM elements
            const grid = document.getElementById('kioskGrid');
            const outputGrid = document.getElementById('outputStatusGrid');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const toastEl = document.getElementById('kioskToast');
            const tabButtons = document.querySelectorAll('.kiosk-tab-btn');
            const swipeWrapper = document.getElementById('kioskSwipeWrapper');
            const kioskTitle = document.getElementById('kioskTitle');
            const pinBtn = document.getElementById('kioskPinBtn');
            const editBtn = document.getElementById('kioskEditBtn');

            // Routing Wizard state
            let selectedInputForRouting = null;
            let selectedRoutingDestination = null; // 'all' or output number
            let currentWizardStep = 1;

            // Profile Creator Wizard state
            let selectedProfileIcon = '📺';

            // Slot Mapper state
            let selectedSlotType = null; // 'shortcut' or 'profile'
            let selectedSlotIndex = null; // 0-7

            // Preset Config state
            let selectedPresetForConfig = null;

            /**
             * Show toast notification
             */
            function showToast(message, type = 'info') {
                toastEl.textContent = message;
                toastEl.className = 'kiosk-toast show ' + type;
                setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 2500);
            }

            /**
             * Escape HTML for safe rendering
             */
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = String(text);
                return div.innerHTML;
            }

            /**
             * Get current "all outputs" routed input (if all same)
             */
            function getCurrentAllRouted() {
                const values = Object.values(routing);
                if (values.length === 0) return null;
                const first = values[0];
                return values.every(v => v === first) ? first : null;
            }

            /**
             * Count how many outputs are using a given input
             */
            function getOutputCountForInput(inputNum) {
                return Object.values(routing).filter(i => i === inputNum).length;
            }

            /**
             * Update connection status display
             */
            function updateStatus(isConnected) {
                connected = isConnected;
                statusDot.classList.toggle('connected', isConnected);
                statusText.textContent = isConnected ? 'Connected' : 'Disconnected';
            }

            /**
             * Tabs Navigation
             */
            function switchTab(tabName) {
                activeTab = tabName;
                const tabOrder = ['routing', 'presets', 'quick-actions', 'profiles'];
                const index = tabOrder.indexOf(tabName);
                
                // Slide container
                swipeWrapper.style.transform = `translateX(-${index * 25}%)`;
                
                // Update active tab buttons
                tabButtons.forEach(btn => {
                    const isActive = btn.dataset.tab === tabName;
                    btn.classList.toggle('active', isActive);
                });

                // Update title
                const titles = {
                    'routing': 'Select Input',
                    'presets': 'Recall Preset',
                    'quick-actions': 'Quick Actions',
                    'profiles': 'Profiles & Scenes'
                };
                kioskTitle.textContent = titles[tabName] || 'Kiosk Mode';

                // Update default pinned tab star/pin icon
                updatePinButtonState();
            }

            function updatePinButtonState() {
                const pinnedTab = localStorage.getItem('kiosk_default_tab');
                pinBtn.classList.toggle('pinned', pinnedTab === activeTab);
            }

            pinBtn.addEventListener('click', () => {
                const pinnedTab = localStorage.getItem('kiosk_default_tab');
                if (pinnedTab === activeTab) {
                    localStorage.removeItem('kiosk_default_tab');
                    showToast('Tab unpinned from default startup', 'info');
                } else {
                    localStorage.setItem('kiosk_default_tab', activeTab);
                    showToast(`Pinned "${kioskTitle.textContent}" as startup default`, 'success');
                }
                updatePinButtonState();
            });

            /**
             * Swipe Gestures Implementation
             */
            let touchStartX = 0;
            let touchStartY = 0;

            const swipeContainer = document.getElementById('kioskSwipeContainer');
            swipeContainer.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            swipeContainer.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
            }, { passive: true });

            function handleSwipe(startX, startY, endX, endY) {
                const dx = endX - startX;
                const dy = endY - startY;
                const swipeThreshold = 80;
                const verticalThreshold = 50;

                // Swipe only triggers when swipe is primarily horizontal
                if (Math.abs(dx) > swipeThreshold && Math.abs(dy) < verticalThreshold) {
                    const tabOrder = ['routing', 'presets', 'quick-actions', 'profiles'];
                    const currentIndex = tabOrder.indexOf(activeTab);
                    if (dx < 0 && currentIndex < tabOrder.length - 1) {
                        switchTab(tabOrder[currentIndex + 1]);
                    } else if (dx > 0 && currentIndex > 0) {
                        switchTab(tabOrder[currentIndex - 1]);
                    }
                }
            }

            /**
             * Edit Layout Mode
             */
            editBtn.addEventListener('click', () => {
                editModeActive = !editModeActive;
                editBtn.classList.toggle('active', editModeActive);
                editBtn.querySelector('span').textContent = editModeActive ? 'Editing Layout' : 'Edit Layout';
                showToast(editModeActive ? 'Edit Mode active. Tap slots to configure.' : 'Layout saved', 'info');
                render();
            });

            /**
             * Modal Dialog Helper Functions
             */
            function openModal(id) {
                document.getElementById(id).classList.add('show');
            }

            function closeModal(id) {
                document.getElementById(id).classList.remove('show');
            }

            window.closeModal = closeModal;

            // Hook up close buttons dynamically
            document.querySelectorAll('.kiosk-modal-close').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const modal = e.currentTarget.closest('.kiosk-modal');
                    closeModal(modal.id);
                });
            });

            /**
             * Tab 1: Routing Tab Functions & Multi-step Wizard
             */
            function handleInputGridClick(inputNum) {
                selectedInputForRouting = inputNum;
                openRoutingWizard();
            }

            window.handleInputGridClick = handleInputGridClick;

            function openRoutingWizard() {
                currentWizardStep = 1;
                document.getElementById('routingModalTitle').textContent = `Route ${inputs[selectedInputForRouting]?.name || 'Input ' + selectedInputForRouting}`;
                
                // Renders output cards
                const outputsGrid = document.getElementById('wizardOutputsList');
                let outputHtml = '';
                for (let o = 1; o <= 8; o++) {
                    const outName = outputs[o]?.name || `Output ${o}`;
                    const currentIn = routing[o] || 0;
                    outputHtml += `
                        <button class="wizard-option-btn" data-output="${o}">
                            ${outName} <span style="font-size:0.8rem; color:var(--text-muted); float:right;">(Current In: ${currentIn || '-'})</span>
                        </button>
                    `;
                }
                outputsGrid.innerHTML = outputHtml;

                // Hook up choice clicks
                outputsGrid.querySelectorAll('.wizard-option-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const outNum = parseInt(btn.dataset.output);
                        selectRoutingDestination(outNum);
                    });
                });

                showWizardStep('routing', 1);
                openModal('routingModal');
            }

            function selectRoutingDestination(dest) {
                selectedRoutingDestination = dest;
                showWizardStep('routing', 2);
            }

            document.getElementById('routeToAllBtn').addEventListener('click', () => {
                selectRoutingDestination('all');
            });

            // Toggle Advanced Routing section
            const advToggle = document.getElementById('toggleAdvancedRouting');
            const advPanel = document.getElementById('advancedRoutingSettings');
            advToggle.addEventListener('click', () => {
                const isHidden = advPanel.classList.contains('hidden');
                advPanel.classList.toggle('hidden', !isHidden);
                advToggle.textContent = isHidden ? 'Hide Advanced Settings...' : 'Show Advanced Settings...';
            });

            // Back/Next Navigation for Routing Wizard
            const routingPrevBtn = document.getElementById('routingPrevBtn');
            const routingNextBtn = document.getElementById('routingNextBtn');
            const routingApplyBtn = document.getElementById('routingApplyBtn');

            routingPrevBtn.addEventListener('click', () => {
                if (currentWizardStep === 2) {
                    showWizardStep('routing', 1);
                }
            });

            function showWizardStep(prefix, step) {
                currentWizardStep = step;
                document.getElementById(`${prefix}Step1`).classList.toggle('hidden', step !== 1);
                document.getElementById(`${prefix}Step2`).classList.toggle('hidden', step !== 2);
                
                const step3 = document.getElementById(`${prefix}Step3`);
                if (step3) step3.classList.toggle('hidden', step !== 3);

                // Prev btn visibility
                const prevBtn = document.getElementById(`${prefix}PrevBtn`);
                if (prevBtn) prevBtn.classList.toggle('hidden', step === 1);

                // Wizard control buttons
                const nextBtn = document.getElementById(`${prefix}NextBtn`);
                const saveBtn = document.getElementById(`${prefix}ApplyBtn`) || document.getElementById(`${prefix}SaveBtn`);
                
                const totalSteps = step3 ? 3 : 2;
                if (nextBtn) nextBtn.classList.toggle('hidden', step === totalSteps);
                if (saveBtn) {
                    saveBtn.classList.toggle('hidden', step !== totalSteps);
                }
            }

            routingApplyBtn.addEventListener('click', async () => {
                closeModal('routingModal');
                showToast('Applying routing configuration...', 'info');

                const input = selectedInputForRouting;
                const dest = selectedRoutingDestination;

                const afv = document.getElementById('routingAudioFollowVideo').checked;
                const mute = document.getElementById('routingMuteAudio').checked;
                const hdcp = document.getElementById('routingHdcpMode').value;
                const hdr = document.getElementById('routingHdrMode').value;
                const scaler = document.getElementById('routingScalerMode').value;
                const arc = document.getElementById('routingArc').checked;

                try {
                    let success = false;
                    if (dest === 'all') {
                        const res = await fetch(`${API_BASE}/switch`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ input: input })
                        });
                        const data = await res.json();
                        success = data.success;
                        if (success) {
                            for (let o = 1; o <= 8; o++) routing[o] = input;
                        }
                    } else {
                        const res = await fetch(`${API_BASE}/output/${dest}/source`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ input: input })
                        });
                        const data = await res.json();
                        success = data.success;
                        if (success) {
                            routing[dest] = input;
                        }
                    }

                    if (success) {
                        const targets = dest === 'all' ? [1,2,3,4,5,6,7,8] : [dest];
                        const promises = [];

                        targets.forEach(t => {
                            // HDCP mode
                            promises.push(fetch(`${API_BASE}/output/${t}/hdcp`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ mode: parseInt(hdcp) })
                            }).catch(() => {}));

                            // HDR mode
                            promises.push(fetch(`${API_BASE}/output/${t}/hdr`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ mode: parseInt(hdr) })
                            }).catch(() => {}));

                            // Scaler mode
                            promises.push(fetch(`${API_BASE}/output/${t}/scaler`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ mode: parseInt(scaler) })
                            }).catch(() => {}));

                            // ARC control
                            promises.push(fetch(`${API_BASE}/output/${t}/arc`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ enable: arc })
                            }).catch(() => {}));

                            // Mute control
                            promises.push(fetch(`${API_BASE}/output/${t}/mute`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ mute: mute })
                            }).catch(() => {}));
                        });

                        await Promise.all(promises);
                        showToast('Routing and output parameters applied', 'success');
                        render();
                    } else {
                        showToast('Failed to execute matrix switch', 'error');
                    }
                } catch (err) {
                    console.error('Route wizard execution error:', err);
                    showToast(`Error: ${err.message}`, 'error');
                }
            });

            /**
             * Tab 2: Presets Tab Functions & Modal Configuration
             */
            function handlePresetClick(num) {
                if (editModeActive) {
                    selectedPresetForConfig = num;
                    const currentName = presets.find(p => p.number === num)?.name || `Preset ${num}`;
                    document.getElementById('presetRenameInput').value = currentName;
                    document.getElementById('presetConfigModalTitle').textContent = `Configure Preset ${num}`;
                    openModal('presetConfigModal');
                } else {
                    recallPreset(num);
                }
            }

            window.handlePresetClick = handlePresetClick;

            async function recallPreset(num) {
                showToast(`Recalling preset ${num}...`, 'info');
                try {
                    const res = await fetch(`${API_BASE}/preset/${num}`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        showToast(`Preset recalled: ${data.name || 'Preset ' + num}`, 'success');
                        fetchStatus(); // Refresh status to sync visual routing
                    } else {
                        showToast(`Failed: ${data.error || 'Unknown'}`, 'error');
                    }
                } catch (err) {
                    showToast(`Failed: ${err.message}`, 'error');
                }
            }

            document.getElementById('presetSaveCurrentStateBtn').addEventListener('click', async () => {
                const num = selectedPresetForConfig;
                showToast(`Saving current routing map to Preset ${num}...`, 'info');
                try {
                    const res = await fetch(`${API_BASE}/preset/${num}/save`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        showToast('Preset routing state saved successfully', 'success');
                    } else {
                        showToast(`Failed: ${data.error}`, 'error');
                    }
                } catch (err) {
                    showToast(`Error: ${err.message}`, 'error');
                }
            });

            document.getElementById('presetConfigSaveBtn').addEventListener('click', async () => {
                const num = selectedPresetForConfig;
                const newName = document.getElementById('presetRenameInput').value.trim();
                if (!newName) return;

                closeModal('presetConfigModal');
                showToast('Renaming preset...', 'info');

                try {
                    const res = await fetch(`${API_BASE}/device-settings/preset/${num}/name`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast('Preset renamed', 'success');
                        const presetObj = presets.find(p => p.number === num);
                        if (presetObj) presetObj.name = newName;
                        render();
                    } else {
                        showToast('Failed to rename preset', 'error');
                    }
                } catch (err) {
                    showToast(`Error: ${err.message}`, 'error');
                }
            });

            /**
             * Tab 3 & 4: Slot-based Grids and Slot Mapper (Edit Layout)
             */
            function handleSlotClick(type, index) {
                selectedSlotType = type;
                selectedSlotIndex = index;
                if (editModeActive) {
                    openSlotMapper();
                } else {
                    const id = type === 'shortcut' ? pinnedQuickActions[index] : pinnedProfiles[index];
                    if (id) {
                        if (type === 'shortcut') executeShortcut(id);
                        else recallProfile(id);
                    }
                }
            }

            window.handleSlotClick = handleSlotClick;

            async function executeShortcut(key) {
                showToast('Executing shortcut...', 'info');
                try {
                    const res = await fetch(`${API_BASE}/shortcuts/${key}/execute`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        showToast('Shortcut executed', 'success');
                    } else {
                        showToast(`Failed: ${data.error}`, 'error');
                    }
                } catch (err) {
                    showToast(`Error: ${err.message}`, 'error');
                }
            }

            async function recallProfile(id) {
                showToast('Recalling profile...', 'info');
                try {
                    const res = await fetch(`${API_BASE}/profile/${id}/recall`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        showToast('Profile activated', 'success');
                        fetchStatus(); // Sync state
                    } else {
                        showToast(`Failed: ${data.error}`, 'error');
                    }
                } catch (err) {
                    showToast(`Error: ${err.message}`, 'error');
                }
            }

            function openSlotMapper() {
                const listEl = document.getElementById('slotMappingList');
                listEl.innerHTML = '';
                
                document.getElementById('slotMapperModalTitle').textContent = `Configure Slot ${selectedSlotIndex + 1}`;
                
                const currentId = selectedSlotType === 'shortcut' 
                    ? pinnedQuickActions[selectedSlotIndex] 
                    : pinnedProfiles[selectedSlotIndex];
                document.getElementById('slotMapperClearBtn').classList.toggle('hidden', !currentId);

                if (selectedSlotType === 'shortcut') {
                    document.getElementById('slotMapperInstruction').textContent = 'Choose Quick Action / Shortcut:';
                    if (shortcuts.length === 0) {
                        listEl.innerHTML = '<p class="empty-message">No shortcuts configured in Full UI.</p>';
                    } else {
                        shortcuts.forEach(s => {
                            listEl.appendChild(createSlotMappingRow(s.icon || '⚡', s.name, () => mapSlot(s.id)));
                        });
                    }
                } else {
                    document.getElementById('slotMapperInstruction').textContent = 'Choose Profile:';
                    
                    // Profile creation trigger row
                    const createRow = createSlotMappingRow('➕', 'Create New Profile...', () => {
                        closeModal('slotMapperModal');
                        openProfileWizard();
                    });
                    createRow.style.borderColor = 'var(--primary-color)';
                    createRow.style.background = 'rgba(59, 130, 246, 0.1)';
                    listEl.appendChild(createRow);

                    if (profiles.length > 0) {
                        profiles.forEach(p => {
                            listEl.appendChild(createSlotMappingRow(p.icon || '📺', p.name, () => mapSlot(p.id)));
                        });
                    }
                }

                openModal('slotMapperModal');
            }

            function createSlotMappingRow(icon, name, clickHandler) {
                const row = document.createElement('div');
                row.className = 'slot-mapping-item';
                row.innerHTML = `
                    <span class="slot-mapping-item-icon">${icon}</span>
                    <span class="slot-mapping-item-name">${escapeHtml(name)}</span>
                `;
                row.addEventListener('click', clickHandler);
                return row;
            }

            function mapSlot(id) {
                closeModal('slotMapperModal');
                if (selectedSlotType === 'shortcut') {
                    pinnedQuickActions[selectedSlotIndex] = id;
                    localStorage.setItem('kiosk_quick_actions', JSON.stringify(pinnedQuickActions));
                } else {
                    pinnedProfiles[selectedSlotIndex] = id;
                    localStorage.setItem('kiosk_profiles', JSON.stringify(pinnedProfiles));
                }
                render();
            }

            document.getElementById('slotMapperClearBtn').addEventListener('click', () => {
                mapSlot(null);
            });

            /**
             * Profile Creator Wizard Functions
             */
            function openProfileWizard() {
                currentWizardStep = 1;
                document.getElementById('profileNameInput').value = '';
                
                // Renders icon options click listeners
                const picker = document.getElementById('profileIconPicker');
                picker.querySelectorAll('.icon-picker-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        picker.querySelector('.icon-picker-btn.selected')?.classList.remove('selected');
                        btn.classList.add('selected');
                        selectedProfileIcon = btn.dataset.icon;
                    });
                });

                // Renders outputs dropdown mapping
                const mapContainer = document.getElementById('profileRoutingMap');
                let mapHtml = '';
                for (let o = 1; o <= 8; o++) {
                    const outName = outputs[o]?.name || `Output ${o}`;
                    mapHtml += `
                        <div class="modal-output-row">
                            <label>${outName}</label>
                            <select class="profile-output-input-select" data-output="${o}">
                                <option value="">Keep Unchanged</option>
                                ${Object.entries(inputs).map(([num, inp]) => `
                                    <option value="${num}">Route to ${inp.name || 'Input ' + num}</option>
                                `).join('')}
                            </select>
                        </div>
                    `;
                }
                mapContainer.innerHTML = mapHtml;

                // Renders macros dropdown lists
                const onSelect = document.getElementById('profilePowerOnMacro');
                const offSelect = document.getElementById('profilePowerOffMacro');
                
                const macroOptions = `<option value="">None</option>` + macros.map(m => `
                    <option value="${m.id}">${m.name}</option>
                `).join('');
                
                onSelect.innerHTML = macroOptions;
                offSelect.innerHTML = macroOptions;

                showWizardStep('profile', 1);
                openModal('profileModal');
            }

            // Nav buttons for Profile Wizard
            document.getElementById('profilePrevBtn').addEventListener('click', () => {
                if (currentWizardStep > 1) {
                    showWizardStep('profile', currentWizardStep - 1);
                }
            });

            document.getElementById('profileNextBtn').addEventListener('click', () => {
                if (currentWizardStep === 1) {
                    const name = document.getElementById('profileNameInput').value.trim();
                    if (!name) {
                        showToast('Please enter a profile name', 'error');
                        return;
                    }
                }
                if (currentWizardStep < 3) {
                    showWizardStep('profile', currentWizardStep + 1);
                }
            });

            document.getElementById('profileSaveBtn').addEventListener('click', async () => {
                const name = document.getElementById('profileNameInput').value.trim();
                if (!name) return;

                closeModal('profileModal');
                showToast('Creating profile...', 'info');

                // Collect output maps
                const outputsConfig = {};
                document.querySelectorAll('.profile-output-input-select').forEach(sel => {
                    const val = sel.value;
                    const outNum = sel.dataset.output;
                    if (val) {
                        outputsConfig[outNum] = { input: parseInt(val) };
                    }
                });

                const onMacro = document.getElementById('profilePowerOnMacro').value;
                const offMacro = document.getElementById('profilePowerOffMacro').value;
                const slug = name.toLowerCase().replace(/[^a-z0-9]/g, '_');

                const profilePayload = {
                    id: slug,
                    name: name,
                    icon: selectedProfileIcon,
                    outputs: outputsConfig,
                    power_on_macro: onMacro || null,
                    power_off_macro: offMacro || null
                };

                try {
                    const res = await fetch(`${API_BASE}/profile`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(profilePayload)
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast('Profile created successfully', 'success');
                        
                        // Refetch profiles
                        const profRes = await fetch(`${API_BASE}/profiles`);
                        if (profRes.ok) {
                            const profData = await profRes.json();
                            if (profData.success) {
                                profiles = profData.data.profiles || [];
                            }
                        }

                        // Set slot configuration
                        mapSlot(slug);
                    } else {
                        showToast(`Failed: ${data.error}`, 'error');
                    }
                } catch (err) {
                    showToast(`Error: ${err.message}`, 'error');
                }
            });

            /**
             * Renders functions for grid views
             */
            function renderPresetsGrid() {
                const gridEl = document.getElementById('presetsGrid');
                let html = '';
                for (let i = 1; i <= 8; i++) {
                    const presetObj = presets.find(p => p.number === i) || {};
                    const name = presetObj.name || `Preset ${i}`;
                    html += `
                        <button class="kiosk-btn" onclick="handlePresetClick(${i})">
                            ${editModeActive ? `<span class="kiosk-btn-config">⚙️</span>` : ''}
                            <span class="kiosk-btn-number">${i}</span>
                            <span class="kiosk-btn-name">${escapeHtml(name)}</span>
                        </button>
                    `;
                }
                gridEl.innerHTML = html;
            }

            function renderQuickActionsGrid() {
                const gridEl = document.getElementById('quickActionsGrid');
                let html = '';
                for (let i = 0; i < 8; i++) {
                    const id = pinnedQuickActions[i];
                    if (id) {
                        const shortcut = shortcuts.find(s => s.id === id) || { name: id, icon: '⚡' };
                        html += `
                            <button class="kiosk-btn" onclick="handleSlotClick('shortcut', ${i})">
                                ${editModeActive ? `<span class="kiosk-btn-config">⚙️</span>` : ''}
                                <span class="kiosk-btn-icon">${shortcut.icon || '⚡'}</span>
                                <span class="kiosk-btn-name">${escapeHtml(shortcut.name)}</span>
                            </button>
                        `;
                    } else {
                        html += `
                            <button class="kiosk-btn placeholder" onclick="handleSlotClick('shortcut', ${i})">
                                <span class="kiosk-btn-icon">➕</span>
                                <span class="kiosk-btn-name">Add Shortcut</span>
                            </button>
                        `;
                    }
                }
                gridEl.innerHTML = html;
            }

            function renderProfilesGrid() {
                const gridEl = document.getElementById('profilesGrid');
                let html = '';
                for (let i = 0; i < 8; i++) {
                    const id = pinnedProfiles[i];
                    if (id) {
                        const profileObj = profiles.find(p => p.id === id) || { name: id, icon: '📺' };
                        html += `
                            <button class="kiosk-btn" onclick="handleSlotClick('profile', ${i})">
                                ${editModeActive ? `<span class="kiosk-btn-config">⚙️</span>` : ''}
                                <span class="kiosk-btn-icon">${profileObj.icon || '📺'}</span>
                                <span class="kiosk-btn-name">${escapeHtml(profileObj.name)}</span>
                            </button>
                        `;
                    } else {
                        html += `
                            <button class="kiosk-btn placeholder" onclick="handleSlotClick('profile', ${i})">
                                <span class="kiosk-btn-icon">➕</span>
                                <span class="kiosk-btn-name">Add Profile</span>
                            </button>
                        `;
                    }
                }
                gridEl.innerHTML = html;
            }

            /**
             * Renders Routing tab and Footer Output states
             */
            function render() {
                const activeInput = getCurrentAllRouted();
                
                // Renders routing grid
                let inputHtml = '';
                for (let i = 1; i <= 8; i++) {
                    const input = inputs[i] || {};
                    const name = input.name || `Input ${i}`;
                    const hasSignal = input.signalActive;
                    const cableConnected = input.cableConnected;
                    const isActive = activeInput === i;
                    const outputCount = getOutputCountForInput(i);

                    let statusClass = 'status-unknown';
                    if (hasSignal) {
                        statusClass = 'status-signal';
                    } else if (cableConnected === true) {
                        statusClass = 'status-cable';
                    } else if (cableConnected === false) {
                        statusClass = 'status-disconnected';
                    }

                    const badgeHtml = outputCount > 0 
                        ? `<span class="kiosk-btn-badge">${outputCount}</span>` 
                        : '';

                    inputHtml += `
                        <button class="kiosk-btn ${statusClass} ${isActive ? 'active' : ''}" 
                                onclick="handleInputGridClick(${i})">
                            ${badgeHtml}
                            <span class="kiosk-btn-number">${i}</span>
                            <span class="kiosk-btn-name">${escapeHtml(name)}</span>
                        </button>
                    `;
                }
                grid.innerHTML = inputHtml;

                // Renders secondary tab grids
                renderPresetsGrid();
                renderQuickActionsGrid();
                renderProfilesGrid();

                // Renders output footer tiles
                let outputHtml = '';
                for (let o = 1; o <= 8; o++) {
                    const output = outputs[o] || {};
                    const currentInput = routing[o] || 0;
                    const inputInfo = inputs[currentInput] || {};
                    const inputName = inputInfo.name || `In ${currentInput}`;
                    const isConnected = output.connected || output.cableConnected;
                    
                    outputHtml += `
                        <div class="output-tile ${isConnected ? 'connected' : 'disconnected'}">
                            <span class="output-tile-num">OUT ${o}</span>
                            <span class="output-tile-input">${currentInput || '-'}</span>
                            <span class="output-tile-name">${currentInput ? escapeHtml(inputName) : 'None'}</span>
                        </div>
                    `;
                }
                outputGrid.innerHTML = outputHtml;
            }

            /**
             * Fetch startup metadata and layouts configuration
             */
            async function loadStartupData() {
                try {
                    const [presetsRes, shortcutsRes, profilesRes, macrosRes] = await Promise.all([
                        fetch(`${API_BASE}/presets`),
                        fetch(`${API_BASE}/shortcuts`),
                        fetch(`${API_BASE}/profiles`),
                        fetch(`${API_BASE}/cec/macros`)
                    ]);

                    if (presetsRes.ok) {
                        const data = await presetsRes.json();
                        presets = data.data?.presets || [];
                    }
                    if (shortcutsRes.ok) {
                        const data = await shortcutsRes.json();
                        shortcuts = data.data?.shortcuts || [];
                    }
                    if (profilesRes.ok) {
                        const data = await profilesRes.json();
                        profiles = data.data?.profiles || [];
                    }
                    if (macrosRes.ok) {
                        const data = await macrosRes.json();
                        macros = data.data || [];
                    }

                    // Initialize pinned layouts arrays
                    const storedActions = localStorage.getItem('kiosk_quick_actions');
                    if (storedActions) {
                        pinnedQuickActions = JSON.parse(storedActions);
                    } else {
                        pinnedQuickActions = Array(8).fill(null);
                        shortcuts.slice(0, 8).forEach((s, idx) => {
                            pinnedQuickActions[idx] = s.id;
                        });
                        localStorage.setItem('kiosk_quick_actions', JSON.stringify(pinnedQuickActions));
                    }

                    const storedProfiles = localStorage.getItem('kiosk_profiles');
                    if (storedProfiles) {
                        pinnedProfiles = JSON.parse(storedProfiles);
                    } else {
                        pinnedProfiles = Array(8).fill(null);
                        profiles.slice(0, 8).forEach((p, idx) => {
                            pinnedProfiles[idx] = p.id;
                        });
                        localStorage.setItem('kiosk_profiles', JSON.stringify(pinnedProfiles));
                    }
                } catch (err) {
                    console.error('Error loading startup lists:', err);
                }
            }

            /**
             * Fetch dynamic status
             */
            async function fetchStatus() {
                try {
                    const [statusRes, inputStatusRes, outputStatusRes] = await Promise.all([
                        fetch(`${API_BASE}/status`),
                        fetch(`${API_BASE}/inputs/status`),
                        fetch(`${API_BASE}/outputs/status`)
                    ]);
                    
                    if (!statusRes.ok) throw new Error(`Status HTTP ${statusRes.status}`);
                    
                    const statusData = await statusRes.json();
                    if (statusData.success) {
                        updateStatus(true);
                        if (statusData.data.routing) {
                            routing = statusData.data.routing;
                        }

                        if (statusData.data.input_names) {
                            for (let i = 1; i <= 8; i++) {
                                inputs[i] = inputs[i] || {};
                                inputs[i].name = statusData.data.input_names[i] || `Input ${i}`;
                            }
                        }

                        if (statusData.data.output_names) {
                            for (let o = 1; o <= 8; o++) {
                                outputs[o] = outputs[o] || {};
                                outputs[o].name = statusData.data.output_names[o] || `Output ${o}`;
                            }
                        }
                    }
                    
                    if (inputStatusRes.ok) {
                        const inputStatusData = await inputStatusRes.json();
                        if (inputStatusData.success && inputStatusData.data.inputs) {
                            inputStatusData.data.inputs.forEach(inp => {
                                if (inp.number >= 1 && inp.number <= 8) {
                                    inputs[inp.number] = inputs[inp.number] || {};
                                    inputs[inp.number].name = inp.name || inputs[inp.number].name || `Input ${inp.number}`;
                                    inputs[inp.number].signalActive = inp.signalActive;
                                    inputs[inp.number].cableConnected = inp.cableConnected;
                                }
                            });
                        }
                    }

                    if (outputStatusRes.ok) {
                        const outputStatusData = await outputStatusRes.json();
                        if (outputStatusData.success && outputStatusData.data.outputs) {
                            outputStatusData.data.outputs.forEach(out => {
                                if (out.number >= 1 && out.number <= 8) {
                                    outputs[out.number] = outputs[out.number] || {};
                                    outputs[out.number].name = out.name || outputs[out.number].name || `Output ${out.number}`;
                                    outputs[out.number].connected = out.connected;
                                    outputs[out.number].cableConnected = out.cableConnected;
                                    outputs[out.number].enabled = out.enabled;
                                }
                            });
                        }
                    }

                    render();
                } catch (err) {
                    console.error('Status fetch error:', err);
                    updateStatus(false);
                }
            }

            /**
             * Connect to WebSocket for real-time updates
             */
            function connectWebSocket() {
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${location.host}/ws`;

                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    console.log('WebSocket connected');
                    updateStatus(true);
                };

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        
                        if (msg.event === 'routing_change' && msg.data) {
                            routing[msg.data.output] = msg.data.input;
                            render();
                        } else if (msg.event === 'status_update' && msg.data) {
                            if (msg.data.routing) routing = msg.data.routing;
                            if (msg.data.input_names) {
                                for (let i = 1; i <= 8; i++) {
                                    inputs[i] = inputs[i] || {};
                                    if (msg.data.input_names[i]) {
                                        inputs[i].name = msg.data.input_names[i];
                                    }
                                }
                            }
                            if (msg.data.output_names) {
                                for (let o = 1; o <= 8; o++) {
                                    outputs[o] = outputs[o] || {};
                                    if (msg.data.output_names[o]) {
                                        outputs[o].name = msg.data.output_names[o];
                                    }
                                }
                            }
                            render();
                        } else if (msg.event === 'signal_change' && msg.data) {
                            const input = inputs[msg.data.input];
                            if (input) {
                                input.signalActive = msg.data.has_signal;
                                render();
                            }
                        } else if (msg.event === 'input_name_change' && msg.data) {
                            const inputNum = msg.data.input;
                            if (inputNum >= 1 && inputNum <= 8) {
                                inputs[inputNum] = inputs[inputNum] || {};
                                inputs[inputNum].name = msg.data.name;
                                render();
                            }
                        } else if (msg.event === 'output_name_change' && msg.data) {
                            const outputNum = msg.data.output;
                            if (outputNum >= 1 && outputNum <= 8) {
                                outputs[outputNum] = outputs[outputNum] || {};
                                outputs[outputNum].name = msg.data.name;
                                render();
                            }
                        } else if (msg.event === 'output_connection' && msg.data) {
                            const outputNum = msg.data.output;
                            if (outputNum >= 1 && outputNum <= 8) {
                                outputs[outputNum] = outputs[outputNum] || {};
                                outputs[outputNum].connected = msg.data.connected;
                                render();
                            }
                        }
                    } catch (err) {
                        console.error('WS message parse error:', err);
                    }
                };

                ws.onclose = () => {
                    console.log('WebSocket closed, reconnecting...');
                    updateStatus(false);
                    setTimeout(connectWebSocket, WS_RECONNECT_DELAY);
                };

                ws.onerror = (err) => {
                    console.error('WebSocket error:', err);
                    ws.close();
                };
            }

            /**
             * Polling fallback
             */
            function startPolling() {
                pollTimer = setInterval(fetchStatus, POLL_INTERVAL);
            }

            /**
             * Double 2-finger tap gesture to exit kiosk mode
             */
            const tripleFingerTap = {
                tapCount: 0,
                lastTapTime: 0,
                TAP_TIMEOUT: 400,
                REQUIRED_FINGERS: 2,
                REQUIRED_TAPS: 2
            };

            function handleTripleFingerTap(e) {
                if (e.touches && e.touches.length !== tripleFingerTap.REQUIRED_FINGERS) {
                    return;
                }

                const now = Date.now();
                if (now - tripleFingerTap.lastTapTime > tripleFingerTap.TAP_TIMEOUT) {
                    tripleFingerTap.tapCount = 0;
                }

                tripleFingerTap.tapCount++;
                tripleFingerTap.lastTapTime = now;

                if (tripleFingerTap.tapCount >= tripleFingerTap.REQUIRED_TAPS) {
                    tripleFingerTap.tapCount = 0;
                    showToast('Exiting kiosk mode...', 'info');
                    setTimeout(() => {
                        window.location.href = '/ui';
                    }, 300);
                }
            }

            /**
             * Initialize kiosk mode
             */
            async function init() {
                // Fetch static lists
                await loadStartupData();

                // Initial fetch
                await fetchStatus();

                // Connect WebSocket
                connectWebSocket();

                // Start polling backup
                startPolling();

                // Load initial default default active tab from localStorage
                const defaultTab = localStorage.getItem('kiosk_default_tab');
                if (defaultTab) {
                    switchTab(defaultTab);
                } else {
                    switchTab('routing');
                }

                // Add active tab click listeners
                tabButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        switchTab(btn.dataset.tab);
                    });
                });

                // Exit kiosk mode gesture
                document.addEventListener('touchstart', handleTripleFingerTap, { passive: true });

                // Prevent double-tap zooming on iOS
                document.addEventListener('touchend', (e) => {
                    const now = Date.now();
                    if (now - (window.lastTouchEnd || 0) < 300) {
                        e.preventDefault();
                    }
                    window.lastTouchEnd = now;
                }, false);
            }

            // Start when ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
