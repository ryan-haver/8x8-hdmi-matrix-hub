- id: F-CEC-008
  area: cec
  title: Enable / disable CEC per port
  claim: docs/API_REFERENCE.md POST /api/cec/{input|output}/{port}/enable
  interfaces:
    device: [set cec index]
    rest: ['POST /api/cec/input/{port}/enable', 'POST /api/cec/output/{port}/enable']
  target: V4
  current: V1
  basis: "Recorded V1 baseline: real REST/simulator tests cover both input/output enable and disable, warm caches, external changes, concurrent edits and failed/incomplete reads (BE-35). The cec_controls packaged-image scenarios now provide linked V2 proof for both flag values on all 16 ports, default enable, boundaries and refusal; all other flags are preserved."
  evidence:
