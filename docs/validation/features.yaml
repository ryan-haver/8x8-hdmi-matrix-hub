# Feature registry - docs/validation/VALIDATION_PLAN.md §3.
#
# One entry per user-facing feature. Maintained by hand; LEDGER.md is generated
# from it (python -m tools.validate ledger). Fields:
#   id          F-<AREA>-NNN (areas: MTX CEC API DOM UI KIO UC HA FLIC OPS SEC REL)
#   area        matrix | cec | api | domain | ui | kiosk | uc | ha | flic | ops | security | reliability
#   title       the capability, in user terms
#   claim       where the project claims it (README, docs, route table, UI)
#   interfaces  how users reach it: device comheads, telnet, rest, ws, ui/kiosk catalog entries, uc, ha, flic, env, files
#   target      level required at v1.0.0 (VALIDATION_PLAN §2 target table)
#   current     RECORDED level: the honest C-pre baseline (2026-09-25, commit c506de5) from existing proof only.
#               Raise it only together with committed evidence. The ledger shows the proven level next to it.
#   basis       why `current` is what it is (the tests that prove it, or why there is nothing)
#   evidence    committed evidence records (docs/validation/evidence/...) that back `current`
#   findings    register rows (docs/REMEDIATION_PLAN.md §4, or docs/validation/findings_pending.yaml) that
#               affect the feature. An open critical/high finding caps the feature at V1.
#   scenarios   tests/validation/scenarios ids that prove it
#
# Baseline rules (conservative; when unsure, lower): V1 = only unit/mocked tests, or driver-level simulator
# tests (real OreiMatrix, no user interface in the path), or screenshot baselines; V2 = an existing test drives
# the REST API -> real hub code -> simulator and asserts the device effect (tests/sim/test_sim_e2e.py);
# V3 = a real client asserts the effect (tests/e2e/smoke.spec.ts). Tests that are strict xfails prove a
# feature broken, so they count as V0.

features:
- id: F-MTX-001
  area: matrix
  title: Route one input to one output
  claim: README "Full matrix control via HTTP endpoints"; docs/API_REFERENCE.md POST /api/switch
  interfaces:
    device: [video switch]
    telnet: ['s output {n} in source {m}']
    rest: [POST /api/switch, 'POST /api/output/{output}/source']
    ws: [switch, switch_failed]
    ui: [matrix/grid/default, matrix/cards/routing-sheet]
    kiosk: [kiosk/routing-modal/step-2]
    uc: [media_player.output_N select_source]
    ha: [select.output_N_source, service hdmi_matrix.switch_input]
    flic: ['POST /api/output/{n}/source']
  target: V4
  current: V3
  basis: 'V3: tests/e2e/smoke.spec.ts ''routing an input to an output in the matrix grid changes the simulator'' (browser
    click -> simulator state asserted). V2: tests/sim/test_sim_e2e.py::test_switch_changes_simulator_state.'
  evidence: []
  findings: []
  scenarios: [routing.switch_one, remote.select_source]
