# Findings discovered by validation, waiting to be added to the register in
# docs/REMEDIATION_PLAN.md §4 (VALIDATION_PLAN §1.7: a feature that does not
# work is a finding). The VAL-nn ids are provisional: when a row is added to
# the register, rename the id in features.yaml and in the scenarios' `finding=`
# links, then delete it here. The ledger/CI treat these rows as open findings.
#
# Each row: id, severity (C/H/M/L), title, location, proposed register row
# (section + text), proof (scenario that demonstrates it), status (open|closed).

findings:
  - id: VAL-07
    severity: M
    title: >-
      A profile is applied differently by recall and by a scene's profile step: recall routes a
      disabled output and turns its stream off and runs the profile's power_on_macro; the scene
      step skips disabled outputs, never changes the stream state (so an "enabled" override has
      no effect), and runs the profile's quick-access `macros` list instead (docs/PHASE_8_SPEC.md),
      so scene_movienight01 sends macro_tv_on twice (once as its own step, once from the profile).
    location: src/rest_api/profiles.py handle_recall_profile, src/scene_execution.py _execute_profile
    register: 4.10 - concrete instance of API-19; the intended behaviour is a DI-2 question (profile = desired state)
    proof: scenes.run_profile_macro_preset (count=2 CEC power-on frames); tests/sim/test_sim_profiles.py recall tests
    status: open
  - id: VAL-08
    severity: M
    title: >-
      A macro's own `continue_on_error` flag is never honoured: every caller (POST /api/cec/macro/{id}/execute,
      profile recall's power-on macro, scene macro steps and profile macros) calls
      MacroManager.execute_macro() with the default continue_on_error=False, so e.g. macro_all_off
      (continue_on_error: true) stops at the first refused target.
    location: src/cec_macros.py execute_macro, src/rest_api/macros.py handle_execute_macro
    register: 4.10 - WP-C1 follow-up (cec_macros.py was outside WP-C1's files)
    proof: code reading; no scenario yet (needs a CEC refusal on one target)
    status: open
  - id: VAL-09
    severity: L
    title: >-
      F-DOM-013 ("Run a scene: delay and shortcut steps") claims a delay step that does not exist:
      scene_manager.VALID_STEP_TYPES is profile, system_action, macro; a "delay" step is rejected.
    location: src/scene_manager.py VALID_STEP_TYPES, docs/validation/features.yaml F-DOM-013
    register: 4.10 - either drop the claim or add the step type (a feature change, so discuss it first per D5)
    proof: tests/sim/test_sim_scenes_v2.py::test_create_rejects_invalid_scenes (delay step -> 400)
    status: open
  - id: VAL-10
    severity: M
    title: >-
      Scene conflict detection never reports a conflict: detect_conflicts() stores only the first
      value per output setting and the "different value" branch is `pass`, so
      POST /api/v2/scenes/{id}/validate always answers has_conflicts=false.
    location: src/scene_manager.py detect_conflicts (~line 380)
    register: 4.10 - WP-C1 follow-up (not in WP-C1's finding list; tests only cover the no-conflict case)
    proof: code reading; tests/test_scene_manager.py TestDetectConflicts has no conflicting case
    status: open
  - id: VAL-11
    severity: L
    title: >-
      The web UI shows no feedback for a scene or profile that ran partly (HTTP 207, success false):
      settings-drawer.js and dashboard-manager.js only toast when result.success is true, so a partial
      failure now looks like nothing happened (before WP-C1 the hub claimed success).
    location: web/js/components/settings-drawer.js:367, web/js/utils/dashboard-manager.js:909
    register: 4.5 (UI) - with UI-01 (errors, status codes)
    proof: scenes.partial_failure shows the 207 body the UI receives
    status: open
