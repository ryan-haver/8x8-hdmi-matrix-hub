name: CI

# Runs on every PR and on pushes to main / release tags.
# The `publish` job (GHCR image) only runs for main and v* tags, never for PRs,
# and only after lint, typecheck, tests and the secret scan have passed.
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Cancel superseded runs for the same PR; never cancel main/tag runs (publishing).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: nothing by default, each job asks for what it needs.
permissions: {}

env:
  PYTHON_VERSION: '3.12'
  # Pinned so CI results do not drift with new tool releases.
  RUFF_VERSION: '0.15.18'
  MYPY_VERSION: '2.1.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: python -m pip install "ruff==${RUFF_VERSION}"

      - name: ruff check
        run: |
          # Only lint paths that exist (tools/ is added in Phase 0).
          paths=""
          for p in src tests custom_components tools run.py run_server.py; do
            if [ -e "$p" ]; then paths="$paths $p"; fi
          done
          echo "Linting:$paths"
          # shellcheck disable=SC2086
          ruff check --output-format=github $paths

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-uc.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-uc.txt "mypy==${MYPY_VERSION}"

      - name: mypy
        run: mypy src/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-uc.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-uc.txt -e ".[dev]"

      - name: pytest
        env:
          USE_MOCK_MATRIX: '1'
        run: pytest tests/ --ignore=tests/ha --tb=short

  ha-test:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Skips cleanly until requirements-test-ha.txt and tests/ha/ exist.
      - name: Check for HA test suite
        id: ha
        run: |
          if [ -f requirements-test-ha.txt ] && [ -d tests/ha ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::requirements-test-ha.txt or tests/ha/ not found; skipping HA tests"
          fi

      - uses: actions/setup-python@v7
        if: steps.ha.outputs.present == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test-ha.txt

      - name: Install dependencies
        if: steps.ha.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test-ha.txt

      - name: pytest tests/ha
        if: steps.ha.outputs.present == 'true'
        run: pytest tests/ha --tb=short

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TODO(HA-04, HA-14): make blocking in Phase 2
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Home Assistant publishes this action only on its default branch
      # (last tagged release is from 2020). SHA pinning comes in a later phase.
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TODO(HA-04, HA-14): make blocking in Phase 2
    continue-on-error: true
    permissions:
      contents: read
    steps:
      # HACS documents this action on its default branch (last tag is 2022).
      - uses: hacs/action@main
        with:
          category: integration
          # Don't post PR comments (would need pull-requests: write).
          comment: false

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Lists the commits of a PR to scan.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks-action needs a licence key only for organisation-owned
      # repositories; this is a personal (User) repository, so none is needed.
      # The repo-root .gitleaks.toml is picked up automatically.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'

  docker-build:
    name: Docker build (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [full, api-only]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Single-arch (amd64) on PRs for speed; publish builds amd64 + arm64.
      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  publish:
    name: Build and push to GHCR
    needs: [lint, typecheck, test, ha-test, gitleaks]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Downcase image name
        run: echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full
