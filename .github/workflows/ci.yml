name: CI

# Runs on every PR and on pushes to main / release tags.
# The `publish` job (GHCR image) only runs for main and v* tags, never for PRs,
# and only after every other gate has passed (all jobs except the PR-only UI
# review comment). Every action is pinned to a commit SHA (version in the
# trailing comment) and container images to a digest (SEC-15); Dependabot
# (.github/dependabot.yml) proposes updates.
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Cancel superseded runs for the same PR; never cancel main/tag runs (publishing).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: nothing by default, each job asks for what it needs.
permissions: {}

env:
  PYTHON_VERSION: '3.12'
  # Python tooling and runtime versions come from the hashed development lock.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: ruff check
        run: |
          # Only lint paths that exist (tools/ is added in Phase 0).
          paths=""
          for p in src tests custom_components tools run.py run_server.py; do
            if [ -e "$p" ]; then paths="$paths $p"; fi
          done
          echo "Linting:$paths"
          # shellcheck disable=SC2086
          ruff check --output-format=github $paths

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: mypy
        run: mypy src/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      # tests/uc (scripted Remote against the real driver) runs in its own job below.
      - name: pytest
        env:
          USE_MOCK_MATRIX: '1'
        run: pytest tests/ --ignore=tests/ha --ignore=tests/uc --tb=short

  # Scripted-Remote harness (UC-21, docs/audits/UC_INTEGRATION_AUDIT.md §7): the
  # matrix simulator -> the hub running src/driver.py exactly as it ships
  # (run.py legacy mode, mDNS off, free ports) -> tools/uc_remote_sim.py speaking
  # the Integration API. Known bugs are strict xfails, so a fix without removing
  # its marker (XPASS) and any regression both fail this job.
  uc:
    name: Remote 3 integration (scripted Remote)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: pytest tests/uc
        run: mkdir -p build && pytest tests/uc -v --tb=short -rxX --basetemp=build/uc-tmp

      - name: Upload driver and simulator logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uc-logs
          path: build/uc-tmp/
          retention-days: 14

  ha-test:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skips cleanly until requirements-test-ha.txt and tests/ha/ exist.
      - name: Check for HA test suite
        id: ha
        run: |
          if [ -f requirements-test-ha.txt ] && [ -d tests/ha ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::requirements-test-ha.txt or tests/ha/ not found; skipping HA tests"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.ha.outputs.present == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test-ha.txt

      - name: Install dependencies
        if: steps.ha.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test-ha.txt

      - name: pytest tests/ha
        if: steps.ha.outputs.present == 'true'
        run: pytest tests/ha --tb=short

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Blocking since WP-D1 (HA-04, HA-13 fixed).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Home Assistant publishes this action only on its default branch (last
      # tagged release is from 2020), so it is pinned to a reviewed commit of
      # master; Dependabot cannot bump branch pins, update the SHA by hand.
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master 2026-10-17

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Blocking since WP-D1; brands pass via custom_components/hdmi_matrix/brand/ (HA-14).
    permissions:
      contents: read
    steps:
      # HACS documents this action on its default branch (last tag is 2022);
      # pinned to a reviewed commit of main, update the SHA by hand.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-06-08
        with:
          category: integration
          # Don't post PR comments (would need pull-requests: write).
          comment: false

  # Repository hygiene (BE-27, tools/check_repo_hygiene.py): rejects newly
  # committed binaries and captures (*.bin, *.exe, *.c4z, *.har), runtime
  # leftovers (__pycache__, *.egg-info, src/*.lock, src/config_state.json) and
  # files over 2 MB stored outside Git LFS. Only the change is checked: the PR
  # against its base, a push against the previous tip; a new branch or tag, or
  # a manual run, checks every file.
  hygiene:
    name: Repository hygiene (binary/size guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check committed files
        env:
          # Passed through the environment, never interpolated into the script.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m tools.check_repo_hygiene --base "${BASE_SHA}"

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Lists the commits of a PR to scan.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks-action needs a licence key only for organisation-owned
      # repositories; this is a personal (User) repository, so none is needed.
      # The repo-root .gitleaks.toml is picked up automatically.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'

  # The one image (D11), built once and started for real (WP-D2, V3 deployment):
  # tests/deploy runs it with the integrations off and with the Remote 3
  # integration on, against the simulator in a container, and brings up each
  # compose variant (default, UC bridge, UC host networking). Checks /api/health
  # and the image HEALTHCHECK, web UI + kiosk, simulator-backed status and a
  # switch, port 9095 only with UC, ucapi not imported without UC, non-root,
  # data kept across a restart, clean SIGTERM stop. `publish` needs this job.
  docker-build:
    name: Docker image (build + deployment tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image version label is hub.__version__ (src/hub/__init__.py), read
      # without importing the package. A v* tag must name that same version.
      - name: Read the application version
        id: version
        run: |
          version=$(python3 -c 'import ast, pathlib; tree = ast.parse(pathlib.Path("src/hub/__init__.py").read_text(encoding="utf-8")); print(next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and [getattr(t, "id", None) for t in n.targets] == ["__version__"]))')
          if [ -z "$version" ]; then echo "::error::no __version__ in src/hub/__init__.py"; exit 1; fi
          release_tag=$(python3 scripts/bump_version.py --tag)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$release_tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match expected $release_tag (hub.__version__ $version)"; exit 1
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Single-arch (amd64) and loaded into the local daemon for the tests;
      # publish builds amd64 + arm64.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: hdmi-matrix-hub:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub

      - name: Check the image version label
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          label=$(docker image inspect hdmi-matrix-hub:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
          echo "org.opencontainers.image.version=$label"
          [ "$label" = "$VERSION" ] || { echo "::error::image version label '$label' != hub.__version__ '$VERSION'"; exit 1; }

      # arm64 (Raspberry Pi, Apple silicon hosts) is built here as well, under
      # QEMU and without running it, so an arm64-only break fails the PR instead
      # of `publish`. Its own cache scope; publish reads both.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build image (linux/arm64, build only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=hub-arm64
          cache-to: type=gha,mode=max,scope=hub-arm64

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      # Plus the BuildKit export of the real build context (.dockerignore, DEP-09).
      - name: Deployment tests (pytest -m docker tests/deploy)
        env:
          HUB_IMAGE: hdmi-matrix-hub:ci
          DEPLOY_EVIDENCE_DIR: build/deploy-evidence
        run: >-
          mkdir -p build && pytest tests/deploy tests/test_repo_hygiene_and_docker.py -m docker
          -v --tb=short -rs --basetemp=build/deploy-tmp

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-evidence
          path: build/deploy-evidence/
          retention-days: 30
          if-no-files-found: ignore

  # UI smoke + visual regression (docs/REMEDIATION_PLAN.md §5.3). Runs in the
  # same pinned Playwright image that generates the baselines locally
  # (npm run visual:update), so font rendering is identical.
  ui:
    name: UI (smoke + visual)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Tag + digest. The tag must match IMAGE in tools/ui/run-in-container.mjs;
    # Dependabot does not update job containers, bump both by hand.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    permissions:
      contents: read
    outputs:
      review-url: ${{ steps.upload-review.outputs.artifact-url }}
      report-url: ${{ steps.upload-report.outputs.artifact-url }}
      tests: ${{ steps.tests.outcome }}
    env:
      UI_CACHE_DIR: /tmp/ui-cache
      npm_config_update_notifier: 'false'
    steps:
      # actions/checkout needs git-lfs in the container to fetch the baselines.
      - name: Install git-lfs
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git-lfs
          git lfs install --system

      # LFS objects are cached so a run only downloads baselines that changed
      # (GitHub counts LFS downloads against the account's bandwidth quota).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the workspace (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: List LFS objects for the cache key
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS objects
        run: git lfs pull

      - name: Set up Python venv and npm packages
        run: |
          out=$(bash tools/ui/container-setup.sh | tee /dev/stderr)
          echo "E2E_PYTHON=${out##*E2E_PYTHON=}" >> "$GITHUB_ENV"

      # Report-only until the web/ code is cleaned up (Phase 5): both commands
      # fail only on findings above the checked-in baselines.
      - name: ESLint (non-blocking)
        continue-on-error: true
        run: npm run lint:js

      - name: Stylelint (non-blocking)
        continue-on-error: true
        run: npm run lint:css

      - name: Smoke + visual tests
        id: tests
        continue-on-error: true
        run: >-
          npx playwright test -c tests/e2e/playwright.config.ts
          --project=smoke --project=desktop --project=tablet --project=phone
          --project=kiosk-tab-a11 --project=kiosk-iphone16promax
          --update-snapshots=none

      - name: Upload Playwright report
        id: upload-report
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Review page: before/after for every snapshot that differs from the base
      # branch (baselines updated in this PR) or from the committed baselines
      # (unapproved changes, re-captured here with --update-snapshots).
      - name: Build review gallery
        if: always() && steps.tests.outcome != 'skipped'
        env:
          BASE_REF: ${{ github.base_ref }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$TESTS_OUTCOME" = failure ]; then
            npx playwright test -c tests/e2e/playwright.config.ts --last-failed \
              --update-snapshots=changed --reporter=list || true
          fi
          if [ -n "$BASE_REF" ]; then
            base=$(git merge-base HEAD "origin/$BASE_REF")
            git lfs fetch origin "$base" || true
          else
            base=HEAD
          fi
          node tools/ui/build_gallery.mjs --base "$base" --changed-only --out ui-gallery
          git status --porcelain -- tests/e2e/visual/__snapshots__ \
            | sed 's#.*tests/e2e/visual/__snapshots__/##' > ui-gallery/unapproved.txt

      - name: Upload review gallery
        id: upload-review
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-review
          path: ui-gallery/
          retention-days: 14

      - name: Fail if UI tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::UI smoke/visual tests failed. Review the ui-review and playwright-report artifacts; approve intended changes with npm run visual:update."
          exit 1

  # Separate job so only this small script gets a write token.
  ui-comment:
    name: UI review comment
    needs: ui
    if: always() && github.event_name == 'pull_request' && needs.ui.result != 'skipped' && needs.ui.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: ui-review
          path: ui-review

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_URL: ${{ needs.ui.outputs.review-url }}
          REPORT_URL: ${{ needs.ui.outputs.report-url }}
          TESTS: ${{ needs.ui.outputs.tests }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ui-visual-review -->';
            let changed = { changedEntries: [], images: [] };
            try { changed = JSON.parse(fs.readFileSync('ui-review/changed.json', 'utf8')); } catch {}
            let unapproved = [];
            try { unapproved = fs.readFileSync('ui-review/unapproved.txt', 'utf8').split('\n').filter(Boolean); } catch {}
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (!changed.changedEntries.length && !existing && process.env.TESTS !== 'failure') return;

            const byEntry = new Map();
            for (const img of changed.images) {
              if (!byEntry.has(img.entry)) byEntry.set(img.entry, []);
              byEntry.get(img.entry).push(`${img.viewport}${img.theme !== 'tron-classic' ? '/' + img.theme : ''} (${img.status}${img.diffPixels ? ', ' + img.diffPixels + ' px' : ''})`);
            }
            const lines = [marker, '### UI visual review', ''];
            if (!byEntry.size) {
              lines.push('No catalog entry differs from the base branch baselines.');
            } else {
              lines.push(`**${byEntry.size}** catalog entr${byEntry.size === 1 ? 'y' : 'ies'} differ from the base branch (${changed.images.length} images):`, '');
              for (const [entry, shots] of [...byEntry].sort()) lines.push(`- \`${entry}\`: ${shots.join(', ')}`);
            }
            if (unapproved.length) {
              lines.push('', `:warning: **${unapproved.length} snapshot(s) differ from the committed baselines** (not approved). If intended, run \`npm run visual:update\` and commit the baselines in a separate \`visual: approve …\` commit.`);
            }
            lines.push('');
            if (process.env.REVIEW_URL) lines.push(`Before/after review page: [ui-review artifact](${process.env.REVIEW_URL}) (download, open \`index.html\`).`);
            if (process.env.REPORT_URL) lines.push(`Playwright report: [playwright-report artifact](${process.env.REPORT_URL}).`);
            lines.push('', `Tests: **${process.env.TESTS || 'unknown'}** · run [#${context.runNumber}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`);
            const body = lines.join('\n');
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  # Proof of function (docs/validation/README.md): every scenario against the
  # real hub (run.py) + simulator, through the REST API (V2), through the web UI
  # in Chromium (V3, in the same pinned Playwright container as `ui`) and through
  # the scripted Remote 3 (V3, the hub restarted with the UC integration).
  # Uploads the evidence records and the regenerated LEDGER.md; fails when a
  # scenario fails without a linked open finding, or a feature drops below its
  # recorded level in docs/validation/features.yaml.
  validation:
    name: Validation (scenarios + ledger)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    permissions:
      contents: read
    env:
      UI_CACHE_DIR: /tmp/ui-cache
      npm_config_update_notifier: 'false'
    steps:
      # Full history: evidence freshness compares the evidence commit with later
      # changes to the scenario's code paths. LFS files are not needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the workspace (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Python venv and npm packages
        run: |
          out=$(bash tools/ui/container-setup.sh | tee /dev/stderr)
          echo "VALIDATE_PYTHON=${out##*E2E_PYTHON=}" >> "$GITHUB_ENV"

      - name: Verify locked validation dependencies
        run: '"$VALIDATE_PYTHON" -m pip check'

      - name: Run scenarios (simulator, api + browser + uc)
        run: >-
          "$VALIDATE_PYTHON" -m tools.validate run --client api --client browser --client uc
          --operator automation --out build/validation

      - name: Generate ledger
        if: always()
        run: >-
          "$VALIDATE_PYTHON" -m tools.validate ledger --timestamp
          --evidence build/validation/evidence --run-summary build/validation/run-summary.json
          --out build/validation/LEDGER.md

      - name: Upload evidence and ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-evidence
          path: build/validation/
          retention-days: 30

      - name: Gate (no unexplained failures, no feature below its recorded level)
        run: >-
          "$VALIDATE_PYTHON" -m tools.validate check --expect-clients api,browser,uc
          --evidence build/validation/evidence --run-summary build/validation/run-summary.json

  # Home Assistant as a real client (docs/validation/README.md, WP-D1): the
  # simulator -> the hub (run.py) -> a real homeassistant/home-assistant
  # container with custom_components/hdmi_matrix installed and configured
  # through Home Assistant's own API. Runs on the bare runner (Docker is there;
  # the `validation` job's Playwright container has none). Fails on a scenario
  # failing without a linked open finding, or if the ha client ran nothing.
  validation-ha:
    name: Validation (Home Assistant container)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run Home Assistant scenarios (simulator, ha client)
        run: python -m tools.validate run --client ha --operator automation --out build/validation-ha

      - name: Generate ledger
        if: always()
        run: >-
          python -m tools.validate ledger --timestamp
          --evidence build/validation-ha/evidence --run-summary build/validation-ha/run-summary.json
          --out build/validation-ha/LEDGER.md

      - name: Upload evidence, ledger and Home Assistant log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-ha-evidence
          path: build/validation-ha/
          retention-days: 30

      - name: Gate (no unexplained failures, no feature below its recorded level)
        run: >-
          python -m tools.validate check --expect-clients ha
          --evidence build/validation-ha/evidence --run-summary build/validation-ha/run-summary.json

  publish:
    name: Build and push to GHCR
    # Every gate except ui-comment (PR only: its skip on main/tags must not
    # block publishing). `ui` gates too: its baselines are owner-approved and
    # checked on every PR.
    needs:
      - lint
      - typecheck
      - test
      - uc
      - ha-test
      - hassfest
      - hacs
      - hygiene
      - gitleaks
      - docker-build
      - ui
      - validation
      - validation-ha
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Downcase image name
        run: echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      # The image version label is hub.__version__ (src/hub/__init__.py), read
      # without importing the package. A v* tag must name that same version.
      - name: Read the application version
        id: version
        run: |
          version=$(python3 -c 'import ast, pathlib; tree = ast.parse(pathlib.Path("src/hub/__init__.py").read_text(encoding="utf-8")); print(next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and [getattr(t, "id", None) for t in n.targets] == ["__version__"]))')
          if [ -z "$version" ]; then echo "::error::no __version__ in src/hub/__init__.py"; exit 1; fi
          release_tag=$(python3 scripts/bump_version.py --tag)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$release_tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match expected $release_tag (hub.__version__ $version)"; exit 1
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          # Overrides the ref-derived version (e.g. `main`) with hub.__version__.
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: |
            type=gha,scope=hub
            type=gha,scope=hub-arm64
          cache-to: type=gha,mode=max,scope=hub

      # The pushed index must carry both platforms (DEP-12; attestation entries,
      # unknown/unknown, are ignored) and the hub.__version__ label.
      - name: Verify the pushed image (amd64 + arm64, version label)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME_LOWER}@${DIGEST}"
          platforms=$(docker buildx imagetools inspect "$image" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "$image: $platforms"
          for platform in linux/amd64 linux/arm64; do
            case " $platforms " in
              *" $platform "*) ;;
              *) echo "::error::$image has no $platform manifest"; exit 1 ;;
            esac
            label=$(docker buildx imagetools inspect "$image" \
              --format "{{ index (index .Image \"$platform\").Config.Labels \"org.opencontainers.image.version\" }}")
            echo "$platform org.opencontainers.image.version=$label"
            [ "$label" = "$VERSION" ] || { echo "::error::$platform version label '$label' != '$VERSION'"; exit 1; }
          done
