[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucapi-orei-hdmi-matrix"
version = "0.1.0"
description = "OREI BK-808 HDMI Matrix integration for Unfolded Circle Remote Two/3"
readme = "README.md"
license = {text = "MPL-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Ryan Haver", email = "ryan.haver@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "ucapi>=0.5.0",
    "pyee>=11.0.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-aiohttp>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
orei-matrix-driver = "driver:main"

[project.urls]
Homepage = "https://github.com/ryan-haver/8x8-hdmi-matrix-hub"
Repository = "https://github.com/ryan-haver/8x8-hdmi-matrix-hub"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "cec_commands",
    "cec_macros",
    "cec_resolver",
    "config",
    "dashboard_layout",
    "driver",
    "orei_matrix",
    "password",
    "persistence",
    "scene_execution",
    "scene_manager",
    "system_shortcuts",
    "telnet_client",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "E402", "E722", "N806", "F811", "F401"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
strict_optional = false
ignore_errors = false
# NOTE: `ignore_errors` was previously `true` which disabled ALL type checking.
# Changed to `false` to enforce type safety. Use `# type: ignore[<code>]`
# comments for specific known issues. Run `mypy src/ --ignore-missing-imports` to verify.
exclude = [
    '^_backups/',
    '^archive/',
    '^\.venv/',
    '^\.agent/',
    '^\.sisyphus/',
    '^scripts/',
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
