# 8x8 HDMI Matrix Hub - Docker Compose (docs/DOCKER.md)
#
# Supports HDCVT HDP-MXC88A-based matrix switches including:
# OREI BK-808, BZBGEAR BG-8K-88MA, A-NeuVideo ANI-8-8K60-S, and more.
#
#   MATRIX_HOST=192.168.1.50 docker compose up -d   # start the hub (web UI: http://<host>:8080/ui)
#   docker compose logs -f                          # logs
#   docker compose down                             # stop
#
# This file starts the core: REST API, web UI (/ui) and kiosk (/kiosk).
# The Unfolded Circle Remote 3 integration is off. To turn it on, add one of
# the override files (both need HUB_HOST_IP, this machine's LAN address):
#
#   docker compose -f docker-compose.yml -f docker-compose.uc-host.yml up -d     # recommended: host networking, mDNS discovery
#   docker compose -f docker-compose.yml -f docker-compose.uc-bridge.yml up -d   # bridge networking, no mDNS, fixed driver URL
#
# Settings can go in a `.env` file next to this file instead of the command line:
#
#   MATRIX_HOST=192.168.1.50      # the matrix's IP address (required)
#   MATRIX_DATA_DIR=./data        # host folder for persistent data (default ./data)
#   HUB_PORT=8080                 # host port of the web UI / REST API
#   LOG_LEVEL=INFO
#   HUB_HOST_IP=192.168.1.20      # only for the UC override files
#
# Persistent storage: everything the hub saves (settings, names, themes,
# profiles, macros, the Remote integration's state) is under /data in the
# container, mounted from MATRIX_DATA_DIR on the host. The container runs as
# UID/GID 1000; on Linux create the folder first so that user can write it:
#   mkdir -p data && sudo chown 1000:1000 data

services:
  hdmi-matrix-hub:
    build:
      context: .
    image: hdmi-matrix-hub:local
    container_name: ${HUB_CONTAINER_NAME:-hdmi-matrix-hub}
    restart: unless-stopped

    ports:
      - "${HUB_PORT:-8080}:8080" # REST API, web UI, kiosk

    volumes:
      - ${MATRIX_DATA_DIR:-./data}:/data

    environment:
      MATRIX_HOST: ${MATRIX_HOST:-}
      MATRIX_PORT: ${MATRIX_PORT:-443}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UC_ENABLED: "false"

    stop_grace_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
